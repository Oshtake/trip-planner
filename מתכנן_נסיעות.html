function toggleLang() {
  curLang = curLang === 'he' ? 'en' : 'he';
  localStorage.setItem('tripplanner_supplier_lang', curLang);

  // Update category names in all trips that use default cats
  const newDefs = DEFAULT_CATS(); // gets new lang's cats
  S.trips.forEach(trip => {
    if (!trip.categories) return;
    trip.categories.forEach(cat => {
      const def = newDefs.find(d => d.id === cat.id);
      if (def) {
        // Only update if the name looks like a known default (matches either lang)
        const heNames = LANGS.he.def_cats.map(c=>c.name);
        const enNames = LANGS.en.def_cats.map(c=>c.name);
        if (heNames.includes(cat.name) || enNames.includes(cat.name)) {
          cat.name = def.name;
        }
      }
    });
  });
  persist();
  applyLang();
}

// ── PDF EXPORT ────────────────────────────────────────────────
function exportPDF() {
  const t = getActive(); if (!t) return;
  const l = L();

  // Inject a temporary doc header into the schedule section
  const schedArea = document.getElementById('tab-schedule');
  const existing = document.getElementById('pdf-doc-header');
  if (existing) existing.remove();

  const meta = [
    t.dest || '',
    t.start + ' → ' + t.end,
    (t.site || '').toUpperCase(),
  ].filter(Boolean).join('  ·  ');

  const hdr = document.createElement('div');
  hdr.id = 'pdf-doc-header';
  hdr.className = 'pdf-doc-header pdf-only';
  hdr.innerHTML =
    '<div class="pdf-doc-title">' + (t.name || 'Trip Schedule') + '</div>' +
    '<div class="pdf-doc-meta">' + meta + '</div>';
  schedArea.insertBefore(hdr, schedArea.firstChild);

  // Switch to schedule tab silently for print
  const prevActive = document.querySelector('.section.active');
  const prevTab    = document.querySelector('.tab.active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(tb => tb.classList.remove('active'));
  schedArea.classList.add('active');

  // Expand all day bodies (remove collapsed)
  const collapsedBodies = document.querySelectorAll('.day-body.collapsed');
  collapsedBodies.forEach(b => b.classList.remove('collapsed'));

  window.print();

  // Restore state
  collapsedBodies.forEach(b => b.classList.add('collapsed'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  if (prevActive) prevActive.classList.add('active');
  if (prevTab)    prevTab.classList.add('active');
  hdr.remove();
}

// ── CALENDAR VIEW ────────────────────────────────────────────
const DT_COLOR = {work:'#2a4a8a',flight:'#c8431a',free:'#2d6a2d',travel:'#8a6a1a',empty:'#ccc'};
const DT_BG    = {work:'rgba(42,74,138,.12)',flight:'rgba(200,67,26,.12)',free:'rgba(45,106,45,.12)',travel:'rgba(138,106,26,.12)',empty:'rgba(0,0,0,.03)'};

function renderCalendar() {
  const t = getActive();
  document.getElementById('no-cal').style.display = t ? 'none' : '';
  const area = document.getElementById('cal-area');
  if (!t) { area.innerHTML = ''; return; }

  // Build a map: date → day object
  const dayMap = {};
  t.days.forEach(d => { dayMap[d.date] = d; });

  // Find all months in the trip
  const start = new Date(t.start + 'T00:00:00Z');
  const end   = new Date(t.end   + 'T00:00:00Z');
  const months = [];
  let cur = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), 1));
  while (cur <= end) {
    months.push({ year: cur.getUTCFullYear(), month: cur.getUTCMonth() });
    cur.setUTCMonth(cur.getUTCMonth() + 1);
  }

  const todayISO = new Date().toISOString().slice(0,10);
  const cats = getCats(t);
  const DOW_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  let html = '<div class="cal-wrap">';

  months.forEach(({year, month}) => {
    const firstDay  = new Date(Date.UTC(year, month, 1));
    const daysInMo  = new Date(Date.UTC(year, month+1, 0)).getUTCDate();
    const startDow  = firstDay.getUTCDay(); // 0=Sun

    html += `<div class="cal-month-block">
      <div class="cal-month-hdr">📅 <span>${MONTH_NAMES[month]}</span>&nbsp;${year}</div>
      <div class="cal-grid">`;

    // Day-of-week headers
    DOW_LABELS.forEach(d => { html += `<div class="cal-dow">${d}</div>`; });

    // Empty cells before first day
    for (let i = 0; i < startDow; i++) {
      html += `<div class="cal-day cal-empty"></div>`;
    }

    // Day cells
    for (let d = 1; d <= daysInMo; d++) {
      const iso  = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const day  = dayMap[iso];
      const isToday = iso === todayISO;

      if (!day) {
        html += `<div class="cal-day cal-empty"><div class="cal-day-num">${d}</div></div>`;
        continue;
      }

      const dt    = day.dayType || 'work';
      const dtCol = DT_COLOR[dt] || '#888';
      const dtBg  = DT_BG[dt]   || 'transparent';
      const entries = day.entries || [];

      // Show up to 3 entry pills
      const MAX_PILLS = 3;
      const pills = entries.slice(0, MAX_PILLS).map(e => {
        const cat = catById(t, e.cat);
        const bg  = cat.color + '22';
        const col = cat.color;
        return `<span class="cal-pill" style="background:${bg};color:${col}">${cat.emoji} ${esc(e.text)}</span>`;
      }).join('');
      const more = entries.length > MAX_PILLS
        ? `<div class="cal-more">+${entries.length - MAX_PILLS} more</div>` : '';

      html += `<div class="cal-day cal-trip-day${isToday?' cal-today':''}"
          style="background:${dtBg}"
          onclick="calDayClick('${esc(t.id)}','${iso}')">
        <div class="cal-day-type-bar" style="background:${dtCol}"></div>
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div class="cal-day-num">${d}</div>
          <div class="cal-day-daynum">D${day.dayNum}</div>
        </div>
        ${pills}${more}
      </div>`;
    }

    // Trailing empty cells to complete last row
    const totalCells = startDow + daysInMo;
    const trailing   = (7 - (totalCells % 7)) % 7;
    for (let i = 0; i < trailing; i++) {
      html += `<div class="cal-day cal-empty"></div>`;
    }

    html += `</div></div>`;
  });

  html += '</div>';
  area.innerHTML = html;
}

function calDayClick(tid, iso) {
  const t = S.trips.find(x => x.id === tid); if (!t) return;
  const day = t.days.find(d => d.date === iso); if (!day) return;
  const cats = getCats(t);
  const dt   = day.dayType || 'work';
  const dtCol= DT_COLOR[dt] || '#888';
  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateObj = new Date(iso + 'T00:00:00Z');
  const dateStr = `${day.dayLabel} · ${dateObj.getUTCDate()} ${MONTH_NAMES[dateObj.getUTCMonth()]} ${dateObj.getUTCFullYear()}`;

  const entries = day.entries || [];
  let bodyHTML = '';
  if (day.goal) {
    bodyHTML += `<div class="cal-popup-goal">🎯 ${esc(day.goal)}</div>`;
  }
  if (day.hotel) {
    bodyHTML += `<div class="cal-popup-hotel">🏨 ${esc(day.hotel)}</div>`;
  }
  if (!entries.length) {
    bodyHTML += `<div class="cal-empty-day-msg">No activities scheduled</div>`;
  } else {
    bodyHTML += entries.map(e => {
      const cat = catById(t, e.cat);
      return `<div class="cal-popup-row">
        <div class="cal-popup-time">${esc(e.time || '—')}</div>
        <div class="cal-popup-entry">
          <div class="cat-bar" style="background:${cat.color};flex-shrink:0"></div>
          ${esc(e.text)}
        </div>
      </div>`;
    }).join('');
  }

  const popup = document.createElement('div');
  popup.className = 'cal-popup-overlay';
  popup.innerHTML = `<div class="cal-popup">
    <div class="cal-popup-hdr" style="border-bottom:3px solid ${dtCol}">
      <div>
        <div class="cal-popup-title">Day ${day.dayNum} · ${dateStr}</div>
        <div class="cal-popup-meta">${DT_ICON[dt]} ${DT_LABEL(dt)}</div>
      </div>
      <button class="cal-popup-close" onclick="this.closest('.cal-popup-overlay').remove()">✕</button>
    </div>
    <div class="cal-popup-body">${bodyHTML}</div>
    <div style="padding:10px 16px;border-top:1px solid var(--border);text-align:right">
      <button class="btn btn-dark btn-sm" onclick="showTab('schedule');this.closest('.cal-popup-overlay').remove()">→ פתח בלוז</button>
    </div>
  </div>`;

  popup.addEventListener('click', e => { if (e.target === popup) popup.remove(); });
  document.body.appendChild(popup);
}

// ── BACKUP / RESTORE ──────────────────────────────────────────
function backupJSON() {
  const data = JSON.stringify(S, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = new Date().toISOString().slice(0,10);
  a.href     = url;
  a.download = `trip-planner-backup-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function restoreJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.trips || !Array.isArray(parsed.trips)) {
        alert('Invalid backup file'); return;
      }
      if (!confirm(`Restore ${parsed.trips.length} trip(s)? This will overwrite current data.`)) return;
      S = parsed;
      persist();
      updateHeader();
      applyLang();
      alert('✓ Restored successfully');
    } catch(err) {
      alert('Failed to parse backup file');
    }
  };
  reader.readAsText(file);
  // reset input so same file can be selected again
  event.target.value = '';
}


// ── VALIDATION ENGINE ────────────────────────────────────────────
function runValidation(t) {
  if (!t) return { score:0, issues:[], warnings:[], passed:[] };
  const issues=[], warnings=[], passed=[];

  // Flights
  const flights = (t.flights||[]);
  const hasOutbound = flights.some(f=>f.date<=t.start||f.date===t.start);
  const hasReturn   = flights.some(f=>f.date>=t.end||f.date===t.end);
  if (hasOutbound) passed.push({txt:'Outbound flight exists', cat:'flight'});
  else issues.push({txt:'No outbound flight defined', cat:'flight'});
  if (hasReturn) passed.push({txt:'Return flight exists', cat:'flight'});
  else issues.push({txt:'No return flight defined', cat:'flight'});

  // Hotels — night coverage
  const start = new Date(t.start+'T00:00:00Z');
  const end   = new Date(t.end+'T00:00:00Z');
  const hotelNights=[], missingNights=[];
  for(let d=new Date(start); d<end; d.setUTCDate(d.getUTCDate()+1)) {
    const iso = d.toISOString().slice(0,10);
    const covered = (t.hotels||[]).some(h=>h.checkin<=iso && h.checkout>iso);
    if(covered) hotelNights.push(iso);
    else missingNights.push(iso);
  }
  const totalNights = hotelNights.length + missingNights.length;
  if(missingNights.length===0) passed.push({txt:`All ${hotelNights.length} nights covered`, cat:'hotel'});
  else {
    if(missingNights.length>2) issues.push({txt:`Hotel missing for ${missingNights.length} nights`, cat:'hotel', nights:missingNights});
    else missingNights.forEach(n=>issues.push({txt:`Hotel missing: ${n}`, cat:'hotel'}));
  }

  // Transfers
  const allEntries = t.days.flatMap(d=>d.entries||[]);
  const hasPickup    = allEntries.some(e=>e.cat==='transfer' && e.text.toLowerCase().match(/pickup|train.*site|station.*site/));
  const hasDropoff   = allEntries.some(e=>e.cat==='transfer' && e.text.toLowerCase().match(/transfer.*airport|airport.*transfer|drop/));
  if(hasPickup)  passed.push({txt:'Airport pickup defined', cat:'transfer'});
  else warnings.push({txt:'Airport pickup not confirmed', cat:'transfer'});
  if(hasDropoff) passed.push({txt:'Airport drop-off defined', cat:'transfer'});
  else warnings.push({txt:'Airport drop-off not confirmed', cat:'transfer'});

  // Schedule completeness
  t.days.forEach(d=>{
    if(d.dayType==='work') {
      if(!d.entries||d.entries.length===0) warnings.push({txt:`Day ${d.dayNum} (${d.date}) has no activities`, cat:'schedule', di:d.dayNum});
      if(!d.goal) warnings.push({txt:`Day ${d.dayNum} has no objective`, cat:'schedule', di:d.dayNum});
      const hasWork = (d.entries||[]).some(e=>e.cat==='work'||e.cat==='qa');
      if(!hasWork && d.entries&&d.entries.length>0) warnings.push({txt:`Day ${d.dayNum} marked Work but no work activities`, cat:'schedule', di:d.dayNum});
    }
  });

  // Score
  const total = passed.length + warnings.length + issues.length;
  const score = total===0 ? 100 : Math.round((passed.length / total) * 100);
  const tripDays = t.days.length;
  const status = issues.length===0 && warnings.length===0 ? 'ready'
               : issues.length===0 ? 'planning' : 'critical';

  return {score, issues, warnings, passed, hotelNights, missingNights, totalNights, tripDays, status};
}

function getChecklist(tid) {
  const key = 'checklist_'+tid;
  try { const v=localStorage.getItem(key); return v?JSON.parse(v):JSON.parse(JSON.stringify(DEFAULT_CHECKLIST)); }
  catch(e){ return JSON.parse(JSON.stringify(DEFAULT_CHECKLIST)); }
}
function saveChecklist(tid, list) {
  localStorage.setItem('checklist_'+tid, JSON.stringify(list));
}

function renderChecklist() {
  const t=getActive();
  const area=document.getElementById('checklist-area');
  if(!area) return;
  if(!t) { area.innerHTML='<div class="no-trip">No active trip</div>'; return; }
  const list = getChecklist(t.id);
  const done = list.filter(i=>i.done).length;
  const pct  = Math.round((done/list.length)*100);
  const items = list.map((item,idx)=>`
    <div class="cl-item ${item.done?'done':''}" onclick="toggleCheckItem('${t.id}',${idx})">
      <div class="cl-check">${item.done?'✓':''}</div>
      <span class="cl-emoji">${item.emoji}</span>
      <span class="cl-text">${item.text}</span>
    </div>`).join('');
  area.innerHTML = `<div class="checklist-section">
    <div class="checklist-header">
      <span>✅ Pre-Flight Checklist</span>
      <span class="checklist-progress">${done}/${list.length} complete</span>
    </div>
    <div class="checklist-progress-bar-wrap"><div class="checklist-progress-bar" style="width:${pct}%"></div></div>
    ${items}
    <div class="cl-add-row">
      <input class="cl-add-inp" id="cl-new-inp" placeholder="Add custom item..." onkeydown="if(event.key==='Enter')addCheckItem('${t.id}')">
      <button class="btn btn-dark btn-sm" onclick="addCheckItem('${t.id}')">+ Add</button>
    </div>
  </div>`;
}

function toggleCheckItem(tid, idx) {
  const list=getChecklist(tid);
  list[idx].done=!list[idx].done;
  saveChecklist(tid,list);
  renderChecklist();
  renderReadinessDashboard();
}

function addCheckItem(tid) {
  const inp=document.getElementById('cl-new-inp');
  if(!inp||!inp.value.trim()) return;
  const list=getChecklist(tid);
  list.push({id:uid(),emoji:'☐',text:inp.value.trim(),done:false});
  saveChecklist(tid,list);
  inp.value='';
  renderChecklist();
}

function renderBudget() {

  document.getElementById('no-budget').style.display = t ? 'none' : '';

  if (!t) { area.innerHTML = ''; return; }

  if (!t.budget) t.budget = { limit: 0, currency: 'USD', expenses: [] };
  const b = t.budget;

    desc: (r.from && r.to) ? `${r.from} → ${r.to}` : (r.type || 'Transfer'),
    amount: parseFloat(r.cost) || 0,
    date: r.date || ''
  }));

  const autoTotal   = autoExp.reduce((s,e) => s + e.amount, 0);
  const total  = manualTotal + autoTotal;
  const limit  = parseFloat(b.limit) || 0;
  const pct    = limit > 0 ? Math.min(100, Math.round((total / limit) * 100)) : 0;
  const over   = limit > 0 && total > limit;
  const cur    = esc(b.currency || 'USD');
  const currencies = ['USD','EUR','ILS','CNY','VND'];

  const autoRows = autoExp.length
    ? autoExp.map(e => `<tr>

    : `<tr><td colspan="4" style="padding:10px 13px;font-size:11px;color:var(--text3);font-style:italic">No transfer costs yet — add cost in Logistics tab</td></tr>`;

    <td><span class="ec" contenteditable onblur="upBudgetExp(${i},'date',this.innerText)">${esc(e.date||'')}</span></td>

    <td><span class="ec" contenteditable style="font-family:var(--mono)" onblur="upBudgetExp(${i},'amount',this.innerText)">${esc(String(e.amount||0))}</span></td>
    <td><button class="btn btn-xs btn-danger" onclick="delBudgetExp(${i})">✕</button></td>
  </tr>`).join('');

  const barColor = over ? 'var(--danger)' : pct > 75 ? 'var(--warn)' : 'var(--accent)';

  area.innerHTML = `
    <div class="stats-row" style="margin-bottom:16px">
      <div class="stat">
        <div class="stat-label">${curLang==='he'?'מגבלת תקציב':'BUDGET LIMIT'}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:6px">
          <input type="number" min="0" style="width:110px;border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:20px;font-weight:900;color:var(--accent);background:transparent;outline:none;font-family:var(--sans)"
            value="${limit}" onchange="upBudgetLimit(this.value)">
          <select style="border:1px solid var(--border);border-radius:4px;padding:4px 7px;font-size:12px;background:var(--surface);color:var(--text);outline:none"
            onchange="upBudgetCurrency(this.value)">
            ${currencies.map(c=>`<option${c===b.currency?' selected':''}>${esc(c)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="stat">
        <div class="stat-label">${curLang==='he'?'סה״כ הוצאות':'TOTAL SPENT'}</div>
        <div class="stat-val" style="${over?'color:var(--danger)':''}">${cur} ${total.toFixed(2)}</div>
      </div>
      <div class="stat">
        <div class="stat-label">${curLang==='he'?'יתרה':'REMAINING'}</div>
        <div class="stat-val" style="color:${over?'var(--danger)':'var(--ok)'}">${limit>0 ? cur+' '+(limit-total).toFixed(2) : '—'}</div>
      </div>
      <div class="stat">
        <div class="stat-label">${curLang==='he'?'נוצל':'USED'}</div>
        <div class="stat-val" style="color:${barColor}">${limit>0?pct+'%':'—'}</div>
        ${limit>0?`<div style="height:5px;background:var(--dim2);border-radius:3px;margin-top:6px"><div style="height:5px;background:${barColor};border-radius:3px;width:${pct}%;transition:width .3s"></div></div>`:''}
      </div>

    <div class="log-block">
      <div class="log-hdr">💸 ${curLang==='he'?'הוצאות':'Expenses'}</div>

        <thead><tr>
          <th>${curLang==='he'?'תאריך':'Date'}</th>
          <th>${curLang==='he'?'תיאור':'Description'}</th>
          <th>${curLang==='he'?'סכום':'Amount'}</th>
          <th></th>
        </tr></thead>
        <tbody>
          <tr class="log-auto-section"><td colspan="4" style="padding:0">
            <div class="log-auto-hdr">
              <span class="log-auto-label">↑ ${curLang==='he'?'מהעברות (אוטומטי)':'From Transfers (auto)'}</span>
            </div>
            <table style="width:100%;border-collapse:collapse">${autoRows}</table>
          </td></tr>
          <tr><td colspan="4" style="padding:0"><span class="log-manual-label">${curLang==='he'?'הוצאות ידניות':'Manual expenses'}</span></td></tr>
          ${manualRows}

      <button class="btn-add-row" onclick="addBudgetExp()">+ ${curLang==='he'?'הוסף הוצאה':'Add Expense'}</button>

function upBudgetLimit(v) {
  const t = getActive(); if(!t) return;
  if (!t.budget) t.budget = {limit:0, currency:'USD', expenses:[]};
  t.budget.limit = parseFloat(v) || 0;
  persist(); renderBudget();
}
function upBudgetCurrency(v) {
  const t = getActive(); if(!t) return;
  if (!t.budget) t.budget = {limit:0, currency:'USD', expenses:[]};
  t.budget.currency = v;
  persist(); renderBudget();
}
function addBudgetExp() {
  const t = getActive(); if(!t) return;
  if (!t.budget) t.budget = {limit:0, currency:'USD', expenses:[]};
  t.budget.expenses.push({date:'', desc:'', amount:0});
  persist(); renderBudget();
}
function upBudgetExp(i, f, v) {
  const t = getActive(); if(!t) return;
  if (!t.budget) return;
  t.budget.expenses[i][f] = f==='amount' ? (parseFloat(v)||0) : v.trim();
  persist();
}
function delBudgetExp(i) {
  const t = getActive(); if(!t) return;
  if (!t.budget) return;
  t.budget.expenses.splice(i, 1);
  persist(); renderBudget();
}

window.addEventListener('beforeunload', function() {

});
// Also save when tab becomes hidden (mobile / switching tabs)
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') {
    try { localStorage.setItem(SK, JSON.stringify(S)); } catch(e) {}
  }
});

// Force render the active tab after data load
(function initialRender() {
  const t = getActive();
  if (!t) return;
  // Find which tab is active and render it
  const activeTab = document.querySelector('.tab.active');
  const tabName = activeTab ? activeTab.getAttribute('data-tab') : 'schedule';
  if (tabName === 'schedule' || !activeTab) {
    // Make schedule tab active
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(tb => tb.classList.remove('active'));
    document.getElementById('tab-schedule').classList.add('active');
    const schedTab = document.querySelector('.tab[data-tab="schedule"]');
    if (schedTab) schedTab.classList.add('active');
    renderSchedule();
  }
})();
