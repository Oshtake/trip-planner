<!DOCTYPE html>
<html lang="en" dir="ltr" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guangzhou Production Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap');

/* ── TOKENS ── */
:root {
  /* ── SPOTIFY LIGHT ── */
  --bg:        #f0f2f5;
  --surface:   #ffffff;
  --surface2:  #f7f8fa;
  --dim:       #eceef2;
  --dim2:      #e2e5ec;
  --border:    #e0e3ea;
  --text:      #121212;
  --text2:     #535353;
  --text3:     #a0a0a0;
  --accent:    #1DB954;      /* Spotify green */
  --accent-2:  #1ed760;      /* hover green */
  --accent-dim:#e8f9ee;
  --red:       #1DB954;
  --warn:      #f59e0b;
  --danger:    #ef4444;
  --ok:        #1DB954;
  --grad:      linear-gradient(135deg, #1DB954 0%, #17a347 100%);
  --grad-dark: linear-gradient(135deg, #121212 0%, #282828 100%);
  --shadow-sm: 0 1px 4px rgba(0,0,0,.08);
  --shadow-md: 0 4px 20px rgba(0,0,0,.12);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.18);
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Figtree', sans-serif;
  --r: 12px;
  --r-sm: 8px;
  --r-pill: 999px;
}

[data-theme="dark"] {
  --bg:        #121212;
  --surface:   #181818;
  --surface2:  #282828;
  --dim:       #282828;
  --dim2:      #3e3e3e;
  --border:    #2a2a2a;
  --text:      #ffffff;
  --text2:     #b3b3b3;
  --text3:     #535353;
  --accent:    #1DB954;
  --accent-2:  #1ed760;
  --accent-dim:rgba(29,185,84,.15);
  --warn:      #f59e0b;
  --danger:    #ef4444;
  --ok:        #1DB954;
  --grad:      linear-gradient(135deg, #1DB954 0%, #17a347 100%);
  --grad-dark: linear-gradient(135deg, #121212 0%, #282828 100%);
  --shadow-sm: 0 1px 4px rgba(0,0,0,.4);
  --shadow-md: 0 4px 20px rgba(0,0,0,.5);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.6);
}

[data-theme="dark"] {
  --bg:       #11141c;
  --surface:  #1a1f2b;
  --dim:      #222836;
  --dim2:     #2b3242;
  --border:   #2e3645;
  --text:     #e8ecf3;
  --text2:    #9aa5b8;
  --text3:    #5f6a7e;
  --red:      #4c9aff;
  --accent:   #4c9aff;
  --accent-2: #2bd4e8;
  --grad:     linear-gradient(135deg, #4c9aff 0%, #2bd4e8 100%);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,.4);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  transition: background .2s, color .2s;
  transition: background .25s, color .25s;
  min-height: 100vh;
  direction: rtl;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.hdr {
  background: var(--grad-dark);
  border-bottom: none;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 2px 20px rgba(0,0,0,.3);
}
.hdr-brand { display: flex; align-items: center; gap: 12px; }
.hdr-brand h1 {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -.02em;
  color: var(--accent);
  text-shadow: 0 0 20px rgba(29,185,84,.4);
}
.hdr-brand .trip-name {
  font-size: 12px;
  color: rgba(255,255,255,.85);
  font-weight: 600;
  padding-right: 12px;
  border-right: 1px solid rgba(255,255,255,.2);
}
.hdr-right { display: flex; align-items: center; gap: 6px; }
.save-pill {
  font-size: 10px;
  font-family: var(--mono);
  color: var(--accent);
  opacity: 0;
  transition: opacity .5s;
  font-weight: 700;
  text-shadow: 0 0 10px rgba(29,185,84,.4);
}
.save-pill.show { opacity: 1; }

/* ── TABS ── */
.tabs {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  padding: 8px 24px 0;
  overflow-x: auto;
  gap: 4px;
}
.tab {
  padding: 10px 20px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--text2);
  border-radius: var(--r-pill) var(--r-pill) 0 0;
  border-bottom: 3px solid transparent;
  font-family: var(--sans);
  white-space: nowrap;
  letter-spacing: .02em;
  text-transform: uppercase;
  transition: color .15s, background .15s;
}
.tab:hover:not(.active) { background: var(--dim); color: var(--text); }
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: var(--accent-dim);
}
.tab:hover:not(.active) { color: var(--text); }

/* ── LAYOUT ── */
.main { padding: 24px 32px; max-width: 1300px; margin: 0 auto; }
.section { display: none; }
.section.active { display: block; }

/* ── BUTTONS ── */
.btn {
  padding: 6px 13px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: var(--sans);
  border: none;
  transition: all .12s;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  line-height: 1;
  letter-spacing: .01em;
}
.btn-dark { background: var(--grad); color: #fff; box-shadow: 0 2px 12px rgba(29,185,84,.35); font-weight: 700; }
.btn-dark:hover { background: var(--accent-2); color: #000; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(29,185,84,.4); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
.btn-ghost:hover { background: var(--dim); color: var(--text); }
.btn-danger { background: transparent; border: 1px solid #f0cac0; color: #a02818; font-size: 11px; }
.btn-danger:hover { background: #fff2f0; }
.btn-sm  { padding: 4px 10px; font-size: 11px; }
.btn-xs  { padding: 2px 7px;  font-size: 10px; }

/* ── TRIPS ── */
.trips-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}
.tcard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px;
  cursor: pointer;
  transition: box-shadow .18s, transform .18s, background .18s;
  position: relative;
  box-shadow: var(--shadow-sm);
}
.tcard:hover { box-shadow: var(--shadow-md); transform: translateY(-4px); background: var(--surface2); }
.tcard.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 30px rgba(29,185,84,.15); background: var(--accent-dim); }
.tcard-acts { position: absolute; bottom: 10px; left: 10px; display: flex; gap: 4px; opacity: 0; transition: opacity .12s; z-index: 5; }
.tcard:hover .tcard-acts { opacity: 1; }
.tcard-tag {
  display: inline-block;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 3px;
  letter-spacing: .05em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.tcard-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; letter-spacing: -.01em; }
.tcard-meta { font-size: 11px; color: var(--text2); font-family: var(--mono); line-height: 1.4; }
.tcard-note { font-size: 11px; color: var(--text2); margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border); }
.empty-state { text-align: center; padding: 64px 20px; color: var(--text2); }
.empty-state .ico { font-size: 32px; margin-bottom: 14px; opacity: .5; }
.empty-state h2 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.empty-state p  { font-size: 12px; margin-bottom: 18px; }

/* ── STATS ── */
.stats-row {
  display: flex;
  gap: 12px;
  margin-bottom: 22px;
}
.stat {
  background: var(--surface);
  padding: 16px 20px;
  flex: 1;
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  transition: box-shadow .15s, transform .15s;
}
.stat:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.stat::before {
  content: '';
  position: absolute;
  top: 0; right: 0; left: 0;
  height: 3px;
  background: var(--grad);
}
.stat:last-child { border-right: none; }
.stat-label { font-size: 9px; font-family: var(--mono); color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.stat-val {
  font-size: 26px;
  font-family: var(--sans);
  font-weight: 900;
  color: var(--accent);
  margin-top: 4px;
  text-shadow: 0 0 12px rgba(29,185,84,.2);
}

/* ── SCHEDULE ── */
/* cards layout — each day is its own box */
.schedule-wrap {
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: transparent;
  border: none;
}

.day-block {
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: box-shadow .18s, transform .18s;
  position: relative;
}
.day-block:hover { box-shadow: 0 8px 24px rgba(29,185,84,.12), var(--shadow-md); transform: translateY(-2px); border-color: var(--accent); }
.day-block:last-child { border-bottom: 1.5px solid var(--border); }

/* Two-column day header */
.day-hdr {
  display: grid;
  grid-template-columns: 40px 64px 1fr auto;
  align-items: stretch;
  background: var(--dim);
  border-bottom: 1px solid var(--border);
  min-height: 54px;
}
.day-num-col {
  display: flex;
  align-items: center;
  justify-content: center;
  border-left: 1px solid var(--border);
  padding: 0 8px;
}
.day-hdr-actions {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 3px;
  padding: 4px 4px;
  border-right: 1px solid var(--border);
  opacity: 0;
  transition: opacity .15s;
}
.day-block:hover .day-hdr-actions { opacity: 1; }
.day-act-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  width: 26px;
  height: 18px;
  cursor: pointer;
  font-size: 10px;
  font-family: var(--mono);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text2);
  padding: 0;
  transition: all .12s;
}
.day-act-btn:hover { background: var(--dim); color: var(--text); border-color: var(--border); }
.day-act-btn.danger:hover { background: #fff0ee; color: #a02818; border-color: #f0cac0; }
.day-num {
  font-family: var(--sans);
  font-size: 22px;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
  text-shadow: 0 0 12px rgba(29,185,84,.3);
}
.day-info-col {
  padding: 11px 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
}
.day-date  { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -.01em; }
.day-goal-inp {
  font-size: 11px;
  color: var(--text2);
  border: none;
  background: transparent;
  font-family: var(--sans);
  width: 100%;
  outline: none;
}
.day-goal-inp::placeholder { color: var(--text3); }
.day-goal-inp:focus { border-bottom: 1px solid var(--border); }
.day-type-col {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
}
.hotel-inp-wrap {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(26,90,106,.08);
  border: 1px solid rgba(26,90,106,.2);
  border-radius: 4px;
  padding: 3px 8px;
}
.hotel-inp-wrap .hotel-ico { font-size: 12px; flex-shrink: 0; }
.hotel-inp {
  border: none;
  background: transparent;
  font-size: 11px;
  font-family: var(--sans);
  color: #1a5a6a;
  outline: none;
  min-width: 80px;
  max-width: 160px;
}
.hotel-inp::placeholder { color: rgba(26,90,106,.45); font-style: italic; }
.day-type-tag {
  font-size: 10px;
  font-family: var(--sans);
  padding: 4px 11px;
  border-radius: 999px;
  font-weight: 700;
  white-space: nowrap;
  letter-spacing: .01em;
  border: none;
}
.dtt-work   { background: #e5efff; color: #0073ea; }
.dtt-flight { background: #fdeede; color: #e8930c; }
.dtt-free   { background: #e4f8ee; color: #00a868; }
.dtt-travel { background: #f0ebff; color: #7b4cdb; }
.dtt-empty  { background: var(--dim2); color: var(--text3); }

/* ── TIMELINE ── */
.timeline {}

.tl-row {
  display: grid;
  grid-template-columns: 72px 1fr;
  border-bottom: 1px solid var(--border);
  min-height: 40px;
  transition: filter .08s;
}
.tl-row:last-child { border-bottom: none; }
.tl-row:hover { background: rgba(29,185,84,.04) !important; border-left: 2px solid var(--accent); }

.tl-time {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--text2);
  border-left: 1px solid var(--border);
  letter-spacing: .02em;
}
.tl-cell {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.drag-handle {
  cursor: grab;
  color: var(--text3);
  font-size: 13px;
  opacity: 0;
  transition: opacity .12s;
  user-select: none;
  flex-shrink: 0;
  letter-spacing: -2px;
}
.tl-row:hover .drag-handle { opacity: 1; }
.tl-row[draggable=true]:active .drag-handle { cursor: grabbing; }
.tl-row.dragging { opacity: .4; background: var(--dim) !important; }
.tl-row.drag-over-top { box-shadow: inset 0 2px 0 0 var(--red); }
.tl-row.drag-over-bot { box-shadow: inset 0 -2px 0 0 var(--red); }
.timeline.drag-target { background: rgba(200,67,26,.04); }
.cat-bar {
  width: 4px;
  height: 22px;
  border-radius: 999px;
  flex-shrink: 0;
}
.tl-text-inp {
  font-size: 13px;
  font-weight: 400;
  flex: 1;
  border: none;
  background: transparent;
  font-family: var(--sans);
  color: var(--text);
  outline: none;
  line-height: 1.4;
}
.tl-text-inp::placeholder { color: var(--text3); font-style: italic; }
.tl-acts {
  display: flex;
  gap: 3px;
  opacity: 0;
  transition: opacity .12s;
}
.tl-row:hover .tl-acts { opacity: 1; }

/* ── ADD ROW ── */
.add-row {
  display: grid;
  grid-template-columns: 72px 1fr;
  border-top: 1px dashed var(--border);
  background: var(--bg);
}
.add-row-time {
  border-left: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
}
.add-row-cell { padding: 7px 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.add-inp {
  font-size: 12px;
  font-family: var(--sans);
  padding: 5px 9px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color .12s;
}
.add-inp:focus { border-color: #a8a29a; }
.add-inp-text { flex: 1; min-width: 120px; }
.time-inp { width: 72px; font-family: var(--mono); font-size: 11px; }

/* ── LOGISTICS ── */
.log-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.log-hdr {
  padding: 13px 18px;
  background: var(--dim);
  border-bottom: 2px solid var(--border);
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 9px;
  letter-spacing: -.01em;
}
.log-table { width: 100%; border-collapse: collapse; }
.log-table th {
  text-align: var(--th-align, right);
  padding: 10px 14px;
  font-size: 10px;
  font-family: var(--sans);
  font-weight: 700;
  color: var(--text3);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.log-table td {
  padding: 11px 14px;
  font-size: 12.5px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  color: var(--text);
}
.log-table tr:last-child td { border-bottom: none; }
.log-table tr:hover td { background: var(--dim); }
.ec { outline: none; border-bottom: 1px dashed transparent; min-width: 28px; display: inline-block; }
.ec:focus { border-bottom-color: var(--text3); }

/* ── GANTT ── */
.gantt-outer {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow-sm);
}
.gtable { border-collapse: collapse; min-width: 100%; }
.gtable th {
  padding: 10px 6px;
  font-size: 10px;
  font-family: var(--sans);
  font-weight: 700;
  background: var(--grad);
  color: #fff;
  border: none;
  border-right: 1px solid rgba(255,255,255,.15);
  text-align: center;
  white-space: nowrap;
  letter-spacing: .02em;
}
.gtable th.gl { text-align: right; min-width: 160px; border-radius: 0; }
.gtable td { border: 1px solid var(--border); padding: 3px; height: 34px; background: var(--surface); }
.gtable td.gl {
  padding: 0 14px;
  font-size: 12px;
  font-weight: 500;
  background: var(--dim);
  white-space: nowrap;
  height: 34px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}
.gbar {
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 8px;
  font-size: 10px;
  font-family: var(--sans);
  font-weight: 700;
  color: #fff;
  letter-spacing: .01em;
  border-radius: 999px;
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.g-sec td {
  background: var(--dim2);
  font-size: 10px;
  font-family: var(--sans);
  font-weight: 800;
  color: var(--accent);
  padding: 7px 14px;
  border: 1px solid var(--border);
  letter-spacing: .05em;
  text-transform: uppercase;
}

/* ── MODAL ── */
.overlay { position: fixed; inset: 0; background: rgba(18,12,8,.35); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(2px); }
.overlay.hidden { display: none; }
.modal {
  background: var(--surface);
  border-radius: 10px;
  padding: 26px;
  width: 100%;
  max-width: 520px;
  max-height: 92vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 16px 48px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.06);
}
.modal-title { font-size: 15px; font-weight: 600; margin-bottom: 18px; letter-spacing: -.01em; }
.modal-x { position: absolute; top: 14px; left: 14px; background: none; border: none; font-size: 15px; cursor: pointer; color: var(--text2); padding: 4px; }
.modal-x:hover { color: var(--text); }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }

/* FORM */
.fr { margin-bottom: 13px; }
.fr label { display: block; font-size: 11px; font-weight: 500; color: var(--text2); margin-bottom: 5px; letter-spacing: .02em; }
.fr input, .fr select, .fr textarea {
  width: 100%;
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 13px;
  font-family: var(--sans);
  color: var(--text);
  background: var(--surface);
  outline: none;
  transition: border-color .12s;
}
.fr input:focus, .fr select:focus, .fr textarea:focus { border-color: #a8a29a; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.divider { text-align: center; color: var(--text3); font-size: 11px; margin: 14px 0; position: relative; }
.divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 44%; height: 1px; background: var(--border); }
.divider::before { right: 0; } .divider::after { left: 0; }
.hint { font-size: 11px; color: var(--text2); padding: 9px 11px; background: var(--dim); border-radius: 4px; margin-top: -6px; margin-bottom: 10px; border: 1px solid var(--border); line-height: 1.5; }

/* DAY SETUP */
.ds-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--border); margin-bottom: 4px; background: var(--surface); }
.ds-daynum { font-family: var(--mono); font-size: 12px; color: var(--red); min-width: 52px; font-weight: 500; }
.ds-daylabel { font-size: 11px; color: var(--text2); min-width: 80px; }
.ds-date { font-size: 10px; color: var(--text3); font-family: var(--mono); flex: 1; }
.ds-btns { display: flex; gap: 3px; }

/* SETTINGS / CATEGORIES */
.cat-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--dim); border-radius: 4px; border: 1px solid var(--border); margin-bottom: 4px; }
.cat-color { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer; flex-shrink: 0; padding: 0; }
.cat-emoji { width: 28px; border: none; background: transparent; font-size: 14px; text-align: center; outline: none; }
.cat-name  { flex: 1; border: none; background: transparent; font-size: 12px; font-family: var(--sans); color: var(--text); outline: none; border-bottom: 1px dashed transparent; }
.cat-name:focus { border-bottom-color: var(--border); }

/* NO TRIP */
.no-trip { text-align: center; padding: 32px; color: var(--text2); font-size: 12px; }

/* DASHED ADD */
.btn-add-row {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin: 7px 12px;
  padding: 4px 10px;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 3px;
  font-size: 11px;
  cursor: pointer;
  color: var(--text2);
  font-family: var(--sans);
  transition: all .12s;
}
.btn-add-row:hover { background: var(--dim); color: var(--text); border-style: solid; }

/* auto rows from schedule */
.log-auto-section {
  border-bottom: 1px solid var(--border);
  background: var(--dim);
}
.log-auto-hdr {
  padding: 7px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--dim);
  border-bottom: 1px solid var(--border);
}
.log-auto-label {
  font-size: 10px;
  font-family: var(--sans);
  letter-spacing: .03em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}
.log-manual-label {
  padding: 7px 14px;
  font-size: 10px;
  font-family: var(--sans);
  letter-spacing: .03em;
  text-transform: uppercase;
  color: var(--text3);
  font-weight: 700;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: block;
}
.log-table tr.auto-row td {
  background: linear-gradient(90deg, rgba(0,115,234,.05), transparent);
  color: var(--text2);
  font-style: normal;
}
.log-table tr.auto-row td .auto-link {
  font-size: 10px;
  color: #fff;
  background: var(--accent);
  padding: 2px 8px;
  border-radius: 999px;
  font-family: var(--sans);
  font-weight: 600;
  margin-left: 6px;
}

/* LTR overrides */
[dir=ltr] .gtable th.gl { text-align: left; }
[dir=ltr] .modal-x { right: 14px; left: auto; }
[dir=ltr] .hdr-brand .trip-name { border-right: none; padding-right: 0; border-left: 1px solid var(--border); padding-left: 12px; }
[dir=ltr] .tcard-acts { right: 10px; left: auto; bottom: 10px; top: auto; }
[dir=ltr] .log-table th { text-align: left; }
[dir=ltr] .day-goal-inp { direction: ltr; }
[dir=ltr] .day-num-col { border-left: none; border-right: 1px solid var(--border); }
[dir=ltr] .day-hdr-actions { border-right: none; border-left: 1px solid var(--border); }
[dir=ltr] .tl-time { border-left: none; border-right: 1px solid var(--border); }
[dir=ltr] .add-row-time { border-left: none; border-right: 1px solid var(--border); }

@media (max-width: 640px) {
  .hdr { padding: 0 14px; }
  .main { padding: 14px; }
  .tabs { padding: 0 14px; }
  .g2 { grid-template-columns: 1fr; }
  .trips-grid { grid-template-columns: 1fr; }
  .stats-row { flex-wrap: wrap; }
}

/* ── READINESS DASHBOARD ── */
.ready-dash {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  margin-bottom: 20px;
}
.ready-dash-header {
  background: var(--grad-dark);
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.ready-score-ring {
  display: flex;
  align-items: center;
  gap: 14px;
}
.ready-score-num {
  font-size: 40px;
  font-weight: 900;
  font-family: var(--sans);
  color: var(--accent);
  text-shadow: 0 0 20px rgba(29,185,84,.5);
  line-height: 1;
}
.ready-score-label { font-size: 12px; color: rgba(255,255,255,.6); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.ready-score-title { font-size: 18px; font-weight: 800; color: #fff; }
.ready-ring-svg { filter: drop-shadow(0 0 8px rgba(29,185,84,.4)); }
.ready-stats-row { display: flex; padding: 16px 24px; gap: 0; border-bottom: 1px solid var(--border); }
.ready-stat { flex:1; text-align: center; padding: 8px; border-right: 1px solid var(--border); }
.ready-stat:last-child { border-right: none; }
.ready-stat-val { font-size: 22px; font-weight: 900; color: var(--accent); }
.ready-stat-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text3); margin-top: 2px; }
.ready-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.ready-col { padding: 18px 24px; }
.ready-col:first-child { border-right: 1px solid var(--border); }
.ready-col-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text3); margin-bottom: 12px; }
.ready-item { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 0; color: var(--text2); }
.ready-item.ok  { color: var(--ok); }
.ready-item.warn { color: var(--warn); }
.ready-item.err  { color: var(--danger); }
.ready-item-icon { font-size: 14px; flex-shrink: 0; }

/* ── MISSING BANNER ── */
.missing-banner {
  background: linear-gradient(135deg, #1a0a0a, #2d1010);
  border: 1px solid rgba(239,68,68,.4);
  border-radius: var(--r);
  padding: 14px 20px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  box-shadow: 0 0 20px rgba(239,68,68,.15);
}
.missing-banner-text { display: flex; flex-direction: column; gap: 4px; }
.missing-banner-title { font-size: 13px; font-weight: 800; color: #ef4444; }
.missing-banner-items { font-size: 11px; color: rgba(255,255,255,.6); }
.missing-banner-btn { background: rgba(239,68,68,.2); border: 1px solid rgba(239,68,68,.4); color: #ef4444; padding: 8px 16px; border-radius: var(--r-pill); font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all .15s; }
.missing-banner-btn:hover { background: rgba(239,68,68,.35); }

/* ── VALIDATION PANEL ── */
.validation-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}
.validation-header {
  background: var(--dim);
  padding: 12px 20px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.validation-header:hover { background: var(--dim2); }
.v-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; font-size: 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
.v-item:last-child { border-bottom: none; }
.v-item:hover { background: var(--dim); }
.v-item.ok   { color: var(--text); }
.v-item.warn { color: var(--warn); background: rgba(245,158,11,.04); }
.v-item.err  { color: var(--danger); background: rgba(239,68,68,.04); }
.v-item-icon { font-size: 15px; flex-shrink: 0; }
.v-section-label { padding: 6px 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text3); background: var(--surface2); border-bottom: 1px solid var(--border); }

/* ── HOTEL TIMELINE ── */
.hotel-timeline { display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; }
.ht-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: var(--r-sm); font-size: 12px; }
.ht-row.covered { background: rgba(29,185,84,.08); color: var(--ok); }
.ht-row.missing { background: rgba(239,68,68,.08); color: var(--danger); }
.ht-date { font-family: var(--mono); font-size: 11px; min-width: 90px; font-weight: 600; }
.ht-name { flex:1; }
.ht-status { font-size: 15px; }
.ht-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); }
.ht-badge.booked  { background: rgba(29,185,84,.2); color: var(--ok); }
.ht-badge.confirm { background: rgba(245,158,11,.2); color: var(--warn); }
.ht-badge.book    { background: rgba(239,68,68,.2); color: var(--danger); }

/* ── CHECKLIST ── */
.checklist-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
.checklist-header { background: var(--grad-dark); padding: 14px 20px; font-size: 13px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: space-between; }
.checklist-progress { font-size: 11px; color: var(--accent); font-weight: 700; }
.checklist-progress-bar-wrap { height: 3px; background: var(--dim2); }
.checklist-progress-bar { height: 3px; background: var(--grad); transition: width .3s; }
.cl-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; user-select: none; }
.cl-item:last-child { border-bottom: none; }
.cl-item:hover { background: var(--dim); }
.cl-check { width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .15s; }
.cl-item.done .cl-check { background: var(--accent); border-color: var(--accent); color: #fff; }
.cl-item.done .cl-text { text-decoration: line-through; color: var(--text3); }
.cl-text { flex:1; font-size: 13px; color: var(--text); }
.cl-emoji { font-size: 16px; }
.cl-add-row { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
.cl-add-inp { flex:1; border: 1px solid var(--border); border-radius: var(--r-pill); padding: 8px 14px; font-size: 12px; background: var(--dim); color: var(--text); outline: none; }
.cl-add-inp:focus { border-color: var(--accent); }

/* ── STATUS BADGE ── */
.status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: var(--r-pill); font-size: 10px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; }
.status-badge.ready    { background: rgba(29,185,84,.15); color: var(--ok); }
.status-badge.planning { background: rgba(245,158,11,.15); color: var(--warn); }
.status-badge.critical { background: rgba(239,68,68,.15); color: var(--danger); }

/* ── HEADER BUTTONS (all white on dark bg) ── */
.hdr .btn {
  color: rgba(255,255,255,.85);
  border-color: rgba(255,255,255,.2);
  background: rgba(255,255,255,.08);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .03em;
}
.hdr .btn:hover {
  color: #fff;
  background: rgba(255,255,255,.18);
  border-color: rgba(255,255,255,.35);
}
.hdr .btn-dark {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 800;
}
.hdr .btn-dark:hover {
  background: var(--accent-2);
  color: #000;
  border-color: var(--accent-2);
  box-shadow: 0 0 16px rgba(29,185,84,.4);
}
/* ── THEME TOGGLE ── */
#btn-theme {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.2);
  color: rgba(255,255,255,.85);
}
#btn-theme:hover { background: rgba(255,255,255,.18); color: #fff; }

/* ── MAIN ── */
.main { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }

/* ── CALENDAR VIEW ── */
.cal-wrap { display: flex; flex-direction: column; gap: 32px; }
.cal-month-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-sm); }
.cal-month-hdr {
  background: var(--grad-dark);
  padding: 14px 20px;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -.01em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.cal-month-hdr span { color: var(--accent); }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-top: 1px solid var(--border);
}
.cal-dow {
  padding: 8px 6px;
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text3);
  background: var(--dim);
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
}
.cal-dow:last-child { border-right: none; }
.cal-day {
  min-height: 90px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 6px;
  position: relative;
  cursor: default;
  transition: background .12s;
  overflow: hidden;
}
.cal-day:nth-child(7n) { border-right: none; }
.cal-day.cal-trip-day { cursor: pointer; }
.cal-day.cal-trip-day:hover { background: var(--accent-dim); }
.cal-day.cal-empty { background: var(--bg); opacity: .4; cursor: default; }
.cal-day-num {
  font-size: 13px;
  font-weight: 700;
  color: var(--text3);
  line-height: 1;
  margin-bottom: 5px;
}
.cal-day.cal-trip-day .cal-day-num { color: var(--text); }
.cal-day.cal-today .cal-day-num {
  background: var(--accent);
  color: #000;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}
.cal-day-type-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.cal-pill {
  font-size: 9px;
  font-weight: 600;
  padding: 2px 5px;
  border-radius: 3px;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: block;
  line-height: 1.3;
}
.cal-day-daynum {
  position: absolute;
  top: 5px;
  right: 6px;
  font-size: 9px;
  font-family: var(--mono);
  color: var(--accent);
  font-weight: 700;
}
.cal-more {
  font-size: 9px;
  color: var(--text3);
  font-style: italic;
  margin-top: 1px;
}

/* popup */
.cal-popup-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 600;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  backdrop-filter: blur(3px);
}
.cal-popup {
  background: var(--surface);
  border-radius: var(--r);
  width: 100%;
  max-width: 440px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
}
.cal-popup-hdr {
  background: var(--grad-dark);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0;
}
.cal-popup-title { font-size: 14px; font-weight: 800; color: #fff; }
.cal-popup-meta  { font-size: 11px; color: rgba(255,255,255,.6); margin-top: 2px; }
.cal-popup-close { background: none; border: none; color: rgba(255,255,255,.7); font-size: 18px; cursor: pointer; line-height: 1; padding: 0; }
.cal-popup-close:hover { color: #fff; }
.cal-popup-body { padding: 14px 16px; }
.cal-popup-row {
  display: grid;
  grid-template-columns: 52px 1fr;
  min-height: 38px;
  border-bottom: 1px solid var(--border);
  align-items: center;
}
.cal-popup-row:last-child { border-bottom: none; }
.cal-popup-time {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text2);
  font-weight: 600;
  padding: 6px 0;
  border-left: 1px solid var(--border);
  text-align: center;
}
.cal-popup-entry {
  padding: 7px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text);
}
.cal-popup-goal {
  font-size: 11px;
  color: var(--text2);
  padding: 10px 14px;
  background: var(--dim);
  border-bottom: 1px solid var(--border);
  font-style: italic;
}
.cal-popup-hotel {
  font-size: 11px;
  color: #1a5a6a;
  padding: 8px 14px;
  background: rgba(26,90,106,.06);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}
.cal-empty-day-msg {
  padding: 24px;
  text-align: center;
  color: var(--text3);
  font-size: 12px;
  font-style: italic;
}



@media print {
  @page {
    size: A4 portrait;
    margin: 14mm 12mm 14mm 12mm;
  }

  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

  body { background: #fff !important; font-family: 'Helvetica Neue', Arial, sans-serif; }

  .pdf-only { display: block !important; }
  .pdf-hide { display: none !important; }

  /* hide app chrome */
  .hdr, .tabs, .btn, .tl-acts, .add-row,
  .tcard-acts, #stats-area { display: none !important; }

  /* layout */
  .main { padding: 0 !important; max-width: 100% !important; }
  .section { display: block !important; }
  #tab-trips, #tab-logistics, #tab-gantt, #tab-cats { display: none !important; }
  #tab-schedule { display: block !important; }

  /* PDF header */
  .pdf-doc-header {
    display: flex !important;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 8px;
    border-bottom: 2px solid #1c1814;
    margin-bottom: 16px;
  }
  .pdf-doc-title { font-size: 18pt; font-weight: 700; color: #1c1814; }
  .pdf-doc-meta  { font-size: 9pt;  color: #6a6058; text-align: right; line-height: 1.5; }

  /* schedule wrap */
  .schedule-wrap { border: none !important; border-radius: 0 !important; }

  /* day block */
  .day-block {
    break-inside: avoid;
    page-break-inside: avoid;
    margin-bottom: 10px;
    border: 1px solid #e8e2d9 !important;
    border-radius: 4px !important;
    overflow: hidden !important;
  }
  .day-block:last-child { border-bottom: 1px solid #e8e2d9 !important; }

  /* day header */
  .day-hdr {
    padding: 8px 14px !important;
    background: #f3f0eb !important;
    border-bottom: 2px solid #c8431a !important;
  }
  .day-num  { font-size: 20pt !important; color: #c8431a !important; font-weight: 900 !important; }
  .day-date { font-size: 13pt !important; font-weight: 700 !important; color: #1c1814 !important; }
  .day-goal-inp { font-size: 10pt !important; pointer-events: none; color: #5a534a !important; font-style: italic; }
  .day-type-tag { font-size: 8pt !important; }
  .hotel-inp { font-size: 9pt !important; pointer-events: none; color: #1a5a6a !important; }
  .hotel-inp-wrap { border: 1px solid #b0d8e0 !important; background: #f0f8fa !important; }

  /* timeline */
  .tl-row { border-bottom: 1px solid #ede8e0 !important; break-inside: avoid; min-height: 32px !important; }
  .tl-time {
    font-size: 9pt !important;
    padding: 6px 8px !important;
    color: #7a7268 !important;
    border-left: 1px solid #e0dbd4 !important;
    font-weight: 600 !important;
  }
  .tl-cell { padding: 6px 10px !important; }
  .cat-bar  { width: 4px !important; height: 18px !important; border-radius: 2px !important; }
  .tl-text-inp {
    font-size: 10.5pt !important;
    pointer-events: none;
    color: #1c1814 !important;
  }

  /* page break hints */
  .day-block { page-break-inside: avoid !important; }
  .day-num-col { border-left: 1px solid #e0dbd4 !important; }
  .day-hdr-actions { display: none !important; }

  /* no empty-state */
  .empty-state { display: none !important; }
}

.pdf-only { display: none; }

@media (max-width: 640px) {
  .hdr { padding: 0 14px; }
  .main { padding: 14px; }
  .tabs { padding: 0 14px; }
  .g2 { grid-template-columns: 1fr; }

}

</style>
</head>

<div class="hdr">

<!-- MODAL: DAY SETUP -->

    <button class="btn btn-ghost" id="m-days-cancel" onclick="cm('m-days')"></button>

<script>
// ── STORAGE ──────────────────────────────────────────────────
const SK = 'tripplanner_supplier_v8';
function loadState() {
  try { return JSON.parse(localStorage.getItem(SK)) || {trips:[], activeId:null}; }
  catch { return {trips:[], activeId:null}; }
}
let S = loadState();
function manualSave() {
  persist();
  const p = document.getElementById('save-pill');
  p.textContent = (curLang==='he' ? '✓ נשמר בהצלחה' : '✓ Saved');
  p.classList.add('show');
  setTimeout(()=>p.classList.remove('show'), 2000);
}

function persist() {
  localStorage.setItem(SK, JSON.stringify(S));
  const p = document.getElementById('save-pill');
  p.classList.add('show');
  clearTimeout(p._t);
  p._t = setTimeout(() => p.classList.remove('show'), 1500);
}
function getActive() { return S.trips.find(t => t.id === S.activeId) || null; }

// ── UTILS ─────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function cm(id) { document.getElementById(id).classList.add('hidden'); }
function om(id) { document.getElementById(id).classList.remove('hidden'); }

function mkDays(start, end) {
  const out = []; let cur = new Date(start+'T00:00:00Z'), i = 1;
  const EO = new Date(end+'T00:00:00Z');
  const l = L();
  while (cur <= EO) {
    const iso = cur.toISOString().slice(0,10);
    const dow = cur.getUTCDay();
    const isSat = dow === 6;
    out.push({ date:iso, dayNum:i, dayLabel: isSat ? l.sat_label : `${l.day_prefix} ${l.day_names[dow]}`, goal:'', hotel:'', dayType: isSat?'free':'work', entries:[] });
    cur.setUTCDate(cur.getUTCDate()+1); i++;
  }
  return out;
}
function fmtDate(d) {
  return new Date(d+'T00:00:00Z').toLocaleDateString(L().locale,{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
}

const SITE_C = {casla:'#b87333',fasa:'#1a4b8a',newstone:'#1a6b3a',squarstone:'#6b1a8a',other:'#555'};
function DT_LABEL(k) { return L().dt_label[k] || k; }
const DT_ICON  = {work:'🏭',flight:'✈',free:'🌿',travel:'🚗',empty:'·'};
const DT_CLS   = {work:'dtt-work',flight:'dtt-flight',free:'dtt-free',travel:'dtt-travel',empty:'dtt-empty'};
const DT_TYPES = ['work','flight','free','travel','empty'];

function DEFAULT_CATS() { return JSON.parse(JSON.stringify(L().def_cats)); }

function getCats(t) { return t.categories || DEFAULT_CATS(); }
function catById(t, id) { return getCats(t).find(c=>c.id===id) || {name:id,emoji:'·',color:'#aaa'}; }
function findCatId(cats, id) { return (cats.find(c=>c.id===id)||cats[0]).id; }

function TPL(type, cats) {
  const l = L();
  const T = {
    work: [
      {time:'07:00', cat:findCatId(cats,'meal'),    text:l.tpl_breakfast},
      {time:'08:00', cat:findCatId(cats,'work'),    text:l.tpl_work},
      {time:'13:00', cat:findCatId(cats,'meal'),    text:l.tpl_lunch},
      {time:'14:00', cat:findCatId(cats,'work'),    text:l.tpl_work},
      {time:'17:00', cat:findCatId(cats,'qa'),      text:l.tpl_qa},
      {time:'18:00', cat:findCatId(cats,'summary'), text:l.tpl_summary},
      {time:'19:30', cat:findCatId(cats,'transfer'),text:l.tpl_hotel},
      {time:'20:00', cat:findCatId(cats,'hotel'),    text:l.tpl_hotel_name},
    ],
    flight: [
      {time:'', cat:findCatId(cats,'transfer'), text:l.tpl_transfer},
      {time:'', cat:findCatId(cats,'flight'),   text:l.tpl_flight},
    ],
    free:   [{time:'', cat:findCatId(cats,'free'), text:l.tpl_free}],
    travel: [
      {time:'07:00', cat:findCatId(cats,'meal'),    text:l.tpl_breakfast},
      {time:'08:00', cat:findCatId(cats,'transfer'),text:l.tpl_travel},
      {time:'13:00', cat:findCatId(cats,'meal'),    text:l.tpl_lunch},
    ],
    empty: [],
  };
  return (T[type]||T.empty).map(e=>({...e,id:uid()}));
}

// ── TABS ──────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');
  ({trips:renderTrips,schedule:renderSchedule,logistics:renderLogistics,gantt:renderGantt,cats:renderCats,calendar:renderCalendar,checklist:renderChecklist,budget:renderBudget}[name]||renderTrips)();
}

// ── UPDATE HEADER ─────────────────────────────────────────────
function editTripName() {
  const t = getActive(); if(!t) return;
  const el = document.getElementById('h-trip');
  // Replace span with an input inline
  const input = document.createElement('input');
  input.type = 'text';
  input.value = t.name;
  input.style.cssText = 'font-size:12px;font-family:var(--sans);padding:3px 8px;border:1px solid var(--red);border-radius:4px;outline:none;background:var(--surface);color:var(--text);min-width:200px';
  el.style.display = 'none';
  el.parentNode.insertBefore(input, el.nextSibling);
  input.focus();
  input.select();

  function commit() {
    const v = input.value.trim();
    if (v) { t.name = v; persist(); }
    input.remove();
    updateHeader();
    if (document.querySelector('.tab.active')?.getAttribute('data-tab')==='trips') renderTrips();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = t.name; input.blur(); }
  });
}

function updateHeader() {
  const t = getActive();
  const el = document.getElementById('h-trip');
  if (t) { el.textContent = `${t.name}  ✎`; el.style.display=''; }
  else    { el.style.display='none'; }
  document.getElementById('btn-export').style.display = t ? '' : 'none';
  document.getElementById('btn-pdf').style.display = t ? '' : 'none';
}

// ── TRIPS ─────────────────────────────────────────────────────
function editSite(tid) {
  const t = S.trips.find(x=>x.id===tid); if(!t) return;
  // Find the tag element for this trip and replace with inline input
  const tagEl = document.querySelector(`.tcard-tag[onclick*="${tid}"]`);
  if (!tagEl) return;
  const col = SITE_C[t.site] || '#555';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = t.site || '';
  input.style.cssText = 'font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 6px;border:1px solid var(--red);border-radius:3px;outline:none;width:90px;text-transform:uppercase;background:var(--surface);color:var(--text)';
  input.onclick = (e) => e.stopPropagation();
  tagEl.replaceWith(input);
  input.focus();
  input.select();

  function commit() {
    const v = input.value.trim();
    if (v) { t.site = v.toLowerCase(); persist(); }
    renderTrips();
    updateHeader();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { renderTrips(); }
  });
}

function renderTrips() {
  const area = document.getElementById('trips-area');
  if (!S.trips.length) {
    area.innerHTML = `<div class="empty-state"><div class="ico">✈</div><h2>${L().empty_title}</h2><p>${L().empty_sub}</p></div>`;
    return;
  }
  area.innerHTML = `<div class="trips-grid">${S.trips.map(t=>{
    const col = SITE_C[t.site]||'#555';
    const act = t.id===S.activeId;
    const l = L();
    return `<div class="tcard${act?' active':''}" onclick="selectTrip('${t.id}')">
      <div class="tcard-acts">
        <button class="btn btn-xs btn-ghost" onclick="event.stopPropagation();cloneTrip('${t.id}')" title="${l.clone_title}">⎘</button>
        <button class="btn btn-xs btn-danger" onclick="event.stopPropagation();deleteTrip('${t.id}')">✕</button>
      </div>
      <div class="tcard-tag" style="background:${col}18;color:${col};cursor:pointer" title="${l.edit_site_title||'Click to edit'}" onclick="event.stopPropagation();editSite('${t.id}')">${t.site.toUpperCase()} ✎</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <div class="tcard-name" style="margin:0">${esc(t.name)}</div>
        <span class="status-badge ${getTripStatus(t)}">${getTripStatus(t)==='ready'?'🟢 Ready':getTripStatus(t)==='planning'?'🟡 Planning':'🔴 Incomplete'}</span>
      </div>
      <div class="tcard-meta">${t.start} → ${t.end} · ${l.days_label(t.days.length)} · ${t.dest||''}</div>
      ${t.notes?`<div class="tcard-note">${esc(t.notes)}</div>`:''}
    </div>`;
  }).join('')}</div>`;
}

function selectTrip(id) {
  S.activeId = id; persist(); updateHeader(); renderTrips();
}
function cloneTrip(id) {
  const src = S.trips.find(t=>t.id===id); if(!src)return;
  const c = JSON.parse(JSON.stringify(src));
  c.id = uid(); c.name += L().copy_suffix;
  S.trips.push(c); persist(); renderTrips();
}
function deleteTrip(id) {
  
  S.trips = S.trips.filter(t=>t.id!==id);
  if(S.activeId===id) S.activeId=null;
  persist(); updateHeader(); renderTrips();
}

// ── NEW TRIP MODAL ────────────────────────────────────────────
function openNewTrip() {
  const sel = document.getElementById('nt-copy');
  sel.innerHTML = `<option value="">${L().m_new_copy_def}</option>` +
    S.trips.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  sel.onchange = () => {
    document.getElementById('copy-hint').style.display = sel.value ? '' : 'none';
  };
  document.getElementById('copy-hint').style.display = 'none';
  ['nt-name','nt-notes'].forEach(id=>document.getElementById(id).value='');
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('nt-start').value = today;
  document.getElementById('nt-end').value   = today;
  om('m-new');
}

// ── PENDING TRIP (day wizard) ─────────────────────────────────
let _pending = null;
let _dsSetup = {};

function doCreateTrip() {
  const name     = document.getElementById('nt-name').value.trim();
  const site     = document.getElementById('nt-site').value;
  const dest     = document.getElementById('nt-dest').value;
  const start    = document.getElementById('nt-start').value;
  const end      = document.getElementById('nt-end').value;
  const notes    = document.getElementById('nt-notes').value.trim();
  const copyFrom = document.getElementById('nt-copy').value;

  if (!name) { alert(L().alert_no_name); return; }
  if (!start||!end||start>end) { alert(L().alert_bad_dates); return; }

  cm('m-new');

  // ── COPY PATH ──
  if (copyFrom) {
    const src = S.trips.find(t=>t.id===copyFrom);
    if (src) {
      const newDays = mkDays(start, end);
      newDays.forEach((d,i) => {
        if (i < src.days.length) {
          d.goal    = src.days[i].goal;
          d.dayType = src.days[i].dayType;
          d.entries = JSON.parse(JSON.stringify(src.days[i].entries));
        }
      });
      const trip = {
        id: uid(), name, site, dest, start, end, notes,
        days: newDays,
        categories: JSON.parse(JSON.stringify(src.categories || DEFAULT_CATS)),
        flights:    JSON.parse(JSON.stringify(src.flights    || [])),
        transfers:  JSON.parse(JSON.stringify(src.transfers  || [])),
      };
      S.trips.push(trip);
      S.activeId = trip.id;
      persist(); updateHeader(); renderTrips(); showTab('schedule');
      return;   // ← this was the missing return
    }
  }

  // ── NEW PATH → day wizard ──
  const cats = DEFAULT_CATS();
  _pending = { id:uid(), name, site, dest, start, end, notes,
               days: mkDays(start,end), categories:cats, flights:[], transfers:[] };
  openDayWizard();
}

// ── DAY WIZARD ────────────────────────────────────────────────
function openDayWizard() {
  _dsSetup = {};
  document.getElementById('ds-title').textContent = L().m_days_title(_pending.days.length);
  const quickBtns = DT_TYPES.map(t=>
    `<button class="btn btn-ghost btn-sm" onclick="fillAll('${t}')">${DT_ICON[t]} ${L().dt_label[t]}</button>`
  ).join('');

  let html = `<div style="font-size:11px;color:var(--text2);margin-bottom:10px">${L().m_days_inst}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)">
      <span style="font-size:11px;color:var(--text2);align-self:center">${L().m_days_fill}</span>${quickBtns}
    </div><div id="ds-rows">`;

  _pending.days.forEach((d,i) => {
    _dsSetup[i] = (d.dayType==='free') ? 'free' : 'work';
    html += `<div class="ds-row" id="dsr-${i}">
      <span class="ds-daynum">${L().day_prefix} ${d.dayNum}</span>
      <span class="ds-daylabel">${d.dayLabel}</span>
      <span class="ds-date">${d.date}</span>
      <div class="ds-btns">
        ${DT_TYPES.map(t=>`<button class="btn btn-xs ${_dsSetup[i]===t?'btn-dark':'btn-ghost'}" id="dsb-${i}-${t}" onclick="setDT(${i},'${t}')" title="${L().dt_label[t]}">${DT_ICON[t]}</button>`).join('')}
      </div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('ds-body').innerHTML = html;
  om('m-days');
}

function setDT(i, type) {
  _dsSetup[i] = type;
  DT_TYPES.forEach(t => {
    const b = document.getElementById(`dsb-${i}-${t}`);
    if(b) b.className = `btn btn-xs ${t===type?'btn-dark':'btn-ghost'}`;
  });
}

function fillAll(type) {
  if(!_pending) return;
  _pending.days.forEach((_,i) => setDT(i, type));
}

function applyDays() {
  if(!_pending) return;
  const cats = _pending.categories;
  _pending.days.forEach((d,i) => {
    const t = _dsSetup[i] || 'empty';
    d.dayType = t;
    d.entries = TPL(t, cats);
  });
  S.trips.push(_pending);
  S.activeId = _pending.id;
  persist(); cm('m-days'); _pending=null;
  updateHeader(); renderTrips(); showTab('schedule');
}

let _drag = null; // {di, ei}

function dragStart(e, di, ei) {
  _drag = {di, ei};
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  // needed for Firefox
  try { e.dataTransfer.setData('text/plain', di+':'+ei); } catch(_){}
}

function dragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drag-over-top,.drag-over-bot').forEach(el=>el.classList.remove('drag-over-top','drag-over-bot'));
  document.querySelectorAll('.timeline.drag-target').forEach(el=>el.classList.remove('drag-target'));
  _drag = null;
}

function dragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  // visual hint on the row being hovered
  const row = e.target.closest('.tl-row');
  document.querySelectorAll('.drag-over-top,.drag-over-bot').forEach(el=>el.classList.remove('drag-over-top','drag-over-bot'));
  if (row) {
    const rect = row.getBoundingClientRect();
    const after = (e.clientY - rect.top) > rect.height/2;
    row.classList.add(after ? 'drag-over-bot' : 'drag-over-top');
  }
}

function dropRow(e, di, ei) {
  e.preventDefault();
  e.stopPropagation();
  if (!_drag) return;
  const t = getActive(); if(!t) return;

  const row = e.target.closest('.tl-row');
  let targetIdx = ei;
  if (row) {
    const rect = row.getBoundingClientRect();
    const after = (e.clientY - rect.top) > rect.height/2;
    if (after) targetIdx = ei + 1;
  }
  moveEntry(t, _drag.di, _drag.ei, di, targetIdx);
}

function dropDay(e, di) {
  e.preventDefault();
  if (!_drag) return;
  // only handle if not already handled by a row
  if (e.target.closest('.tl-row')) return;
  const t = getActive(); if(!t) return;
  const targetIdx = t.days[di].entries.length; // end of day
  moveEntry(t, _drag.di, _drag.ei, di, targetIdx);
}

function timeToMin(s) {
  if (!s || !/^\d{1,2}:\d{2}$/.test(s)) return null;
  const [h,m] = s.split(':').map(Number);
  return h*60+m;
}
function minToTime(min) {
  if (min < 0) min = 0;
  if (min > 23*60+59) min = 23*60+59;
  const h = Math.floor(min/60), m = min%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

function moveEntry(t, fromDi, fromEi, toDi, toIdx) {
  const entry = t.days[fromDi].entries[fromEi];
  if (!entry) return;
  // Remove from source
  t.days[fromDi].entries.splice(fromEi, 1);
  // Adjust target index if moving within same day and after the removed position
  if (fromDi === toDi && fromEi < toIdx) toIdx--;
  // Clamp
  if (toIdx < 0) toIdx = 0;
  if (toIdx > t.days[toDi].entries.length) toIdx = t.days[toDi].entries.length;

  // ── Compute new time based on neighbours at the drop position ──
  const list = t.days[toDi].entries;
  const beforeEntry = list[toIdx-1];           // entry that will sit above
  const afterEntry  = list[toIdx];             // entry that will sit below
  const bMin = beforeEntry ? timeToMin(beforeEntry.time) : null;
  const aMin = afterEntry  ? timeToMin(afterEntry.time)  : null;

  let newTime = entry.time; // fallback: keep original
  if (bMin !== null && aMin !== null) {
    // midpoint between the two neighbours
    newTime = minToTime(Math.round((bMin + aMin) / 2));
  } else if (bMin !== null && aMin === null) {
    // dropped at end → 1 hour after the last timed entry
    newTime = minToTime(bMin + 60);
  } else if (bMin === null && aMin !== null) {
    // dropped at start → 1 hour before the first timed entry
    newTime = minToTime(aMin - 60);
  }
  entry.time = newTime;

  list.splice(toIdx, 0, entry);

  // keep the day sorted by time (entries without time stay where placed)
  list.sort((x,y) => {
    const xm = timeToMin(x.time), ym = timeToMin(y.time);
    if (xm === null) return 0;
    if (ym === null) return 0;
    return xm - ym;
  });

  persist();
  renderSchedule();
}

function resequenceDays(t) {
  const l = L();

  // Find an anchor: first day that has a valid date
  let anchorIdx = t.days.findIndex(d => d.date && !isNaN(new Date(d.date+'T00:00:00Z').getTime()));
  if (anchorIdx === -1) {
    // no valid date at all — use today as fallback
    t.days[0].date = new Date().toISOString().slice(0,10);
    anchorIdx = 0;
  }

  // Compute day[0] date by walking back from the anchor
  const anchor = new Date(t.days[anchorIdx].date+'T00:00:00Z');
  const day0 = new Date(anchor);
  day0.setUTCDate(day0.getUTCDate() - anchorIdx);

  // Now sequence every day from day0
  for (let i = 0; i < t.days.length; i++) {
    const cur = new Date(day0);
    cur.setUTCDate(cur.getUTCDate() + i);
    const iso = cur.toISOString().slice(0,10);
    const dw  = cur.getUTCDay();
    t.days[i].date     = iso;
    t.days[i].dayNum   = i+1;
    t.days[i].dayLabel = dw===6 ? l.sat_label : `${l.day_prefix} ${l.day_names[dw]}`;
  }

  t.start = t.days[0].date;
  t.end   = t.days[t.days.length-1].date;
}

function addDayBefore(tid, di) {
  const t=S.trips.find(x=>x.id===tid); if(!t)return;
  const newDay = { id:uid(), date:'', dayNum:0, dayLabel:'', goal:'', hotel:'', dayType:'work', entries:[] };
  t.days.splice(di, 0, newDay);
  resequenceDays(t);
  persist(); renderSchedule();
}

function addDayAfter(tid, di) {
  const t=S.trips.find(x=>x.id===tid); if(!t)return;
  const l = L();

  // 1. Insert new blank day with date = di's date + 1
  const base = new Date(t.days[di].date+'T00:00:00Z');
  base.setUTCDate(base.getUTCDate()+1);
  const newDate = base.toISOString().slice(0,10);
  const dow = base.getUTCDay();
  const isSat = dow===6;
  const newDay = {
    id: uid(),
    date: newDate,
    dayNum: 0,
    dayLabel: isSat ? l.sat_label : `${l.day_prefix} ${l.day_names[dow]}`,
    goal: '', hotel: '', dayType: isSat?'free':'work', entries: []
  };
  t.days.splice(di+1, 0, newDay);
  resequenceDays(t);
  persist(); renderSchedule();
}

function removeDay(tid, di) {
  const t=S.trips.find(x=>x.id===tid); if(!t)return;
  if(t.days.length<=1) { alert('Cannot remove the only day'); return; }
  // confirm skipped — file:// protocol blocks dialogs in Chrome

  t.days.splice(di, 1);
  resequenceDays(t);

}

  const periods = [];

  (t.days||[]).forEach(d => {

// ── GANTT (logistics only) ────────────────────────────────────
function renderGantt() {
  const t = getActive();
  document.getElementById('no-gantt').style.display = t?'none':'';
  const tbl = document.getElementById('gantt-tbl');
  if(!t){tbl.innerHTML='';return;}

  let html = '<thead><tr><th class="gl">'+(curLang==='en'?'Activity':'פעילות')+'</th>';
  t.days.forEach(d => html+=`<th title="${esc(d.goal)}">${d.dayLabel}<br><span style="font-size:8px;opacity:.6">${L().day_prefix} ${d.dayNum}</span></th>`);
  html+='</tr></thead><tbody>';

  // Logistics section
  html+=`<tr class="g-sec"><td colspan="${t.days.length+1}">${L().g_logistics}</td></tr>`;
  const logCats = getCats(t).filter(c=>c.id==='flight'||c.id==='transfer');
  logCats.forEach(cat => {
    html+=`<tr><td class="gl"><div class="cat-bar" style="background:${cat.color};width:3px;height:16px;border-radius:2px"></div>${esc(cat.emoji)} ${esc(cat.name)}</td>`;
    t.days.forEach(d=>{
      const has=d.entries.some(e=>e.cat===cat.id);
      html+=`<td>${has?`<div class="gbar" style="background:${cat.color}">✓</div>`:''}</td>`;
    });
    html+='</tr>';
  });

  // Day types section
  html+=`<tr class="g-sec"><td colspan="${t.days.length+1}">${L().g_day_type}</td></tr>`;
  html+=`<tr><td class="gl">${L().g_day_label}</td>`;
  const DTC = {work:'#2a4a8a',flight:'#c8431a',free:'#2d6a2d',travel:'#8a6a1a',empty:'#ccc'};
  t.days.forEach(d=>{
    const dt=d.dayType||'work';
    html+=`<td title="${DT_LABEL(dt)}"><div class="gbar" style="background:${DTC[dt]};font-size:9px">${DT_ICON[dt]}</div></td>`;
  });
  html+='</tr>';

  // Hotels row
  const hasAnyHotel = t.days.some(d=>(d.hotel||'').trim());
  if(hasAnyHotel) {
    html+=`<tr class="g-sec"><td colspan="${t.days.length+1}">🏨 HOTELS</td></tr>`;
    html+=`<tr><td class="gl">🏨 Hotel</td>`;
    let lastHotel = '';
    t.days.forEach(d=>{
      const h = (d.hotel||'').trim();
      const changed = h && h !== lastHotel;
      if(changed) lastHotel = h;
      html+=`<td title="${esc(h)}">${h ? `<div class="gbar" style="background:#1a5a6a;font-size:8px;overflow:hidden">${changed?esc(h):''}</div>` : ''}</td>`;
    });
    html+='</tr>';
  }

  // Models (auto-detect 4-digit)
  const models = [...new Set(t.days.flatMap(d=>d.entries.flatMap(e=>(e.text||'').match(/\b\d{4}\b/g)||[])))].sort();
  if(models.length) {
    html+=`<tr class="g-sec"><td colspan="${t.days.length+1}">${L().g_models}</td></tr>`;
    models.forEach(m=>{
      html+=`<tr><td class="gl">◆ ${m}</td>`;
      t.days.forEach(d=>{
        const has=d.entries.some(e=>(e.text||'').includes(m));
        html+=`<td>${has?`<div class="gbar" style="background:#6b3d8a">${m}</div>`:''}</td>`;
      });
      html+='</tr>';
    });
  }

  tbl.innerHTML=html+'</tbody>';
}

// ── CATEGORIES ────────────────────────────────────────────────
function renderCats() {
  const t = getActive();
  document.getElementById('no-cats').style.display = t?'none':'';
  const area = document.getElementById('cats-area');
  if(!t){area.innerHTML='';return;}
  const cats = getCats(t);
  area.innerHTML = `<div style="max-width:480px">
    <div style="font-size:13px;font-weight:600;margin-bottom:8px">${L().cats_title(esc(t.name))}</div>
    <div style="font-size:11px;color:var(--text2);margin-bottom:14px">${L().cats_note}</div>
    <div>${cats.map((c,i)=>`<div class="cat-item">
      <input type="color" class="cat-color" value="${c.color}" onchange="upCat(${i},'color',this.value)">
      <input class="cat-emoji" value="${esc(c.emoji)}" onchange="upCat(${i},'emoji',this.value)" maxlength="2">
      <input class="cat-name" value="${esc(c.name)}" onchange="upCat(${i},'name',this.value)" placeholder="${L().cat_ph}">
      <button class="btn btn-xs btn-danger" onclick="delCat(${i})">✕</button>
    </div>`).join('')}</div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="btn btn-ghost btn-sm" onclick="addCat()">${L().btn_add_cat}</button>
      <button class="btn btn-ghost btn-sm" onclick="resetCats()">${L().btn_reset_cats}</button>
    </div>
  </div>`;
}
function upCat(i,f,v) { const t=getActive();if(!t)return; if(!t.categories)t.categories=JSON.parse(JSON.stringify(DEFAULT_CATS)); t.categories[i][f]=v; persist(); }
function delCat(i) {
  const t=getActive();if(!t)return;
  t.categories.splice(i,1); persist(); renderCats();
}
function addCat() {
  const t=getActive();if(!t)return;
  if(!t.categories)t.categories=JSON.parse(JSON.stringify(DEFAULT_CATS));
  t.categories.push({id:uid(),name:curLang==='en'?'Category':'קטגוריה',emoji:'•',color:'#888'});
  persist(); renderCats();
}
function resetCats() {
  const t=getActive();if(!t)return;
  t.categories=DEFAULT_CATS(); persist(); renderCats();
}

const EX = {
  // Colors
  C_HEADER_BG:  '1C1814',   // dark header bg
  C_HEADER_FG:  'FFFFFF',   // header text
  C_DAY_BG:     'F3F0EB',   // day row bg
  C_DAY_FG:     '1C1814',
  C_ACCENT:     'C8431A',   // red accent
  C_ACCENT_FG:  'FFFFFF',
  C_BORDER:     'D4CDC3',
  C_ALT:        'FAF8F5',   // alternating row

  hdr: (v) => ({
    v, t:'s',
    s:{ font:{bold:true, color:{rgb:'FFFFFF'}, name:'Calibri', sz:10},
        fill:{fgColor:{rgb:'1C1814'}},
        alignment:{horizontal:'center', vertical:'center', wrapText:true},
        border: EX.border() }
  }),

  dayHdr: (v) => ({
    v, t:'s',
    s:{ font:{bold:true, color:{rgb:'1C1814'}, name:'Calibri', sz:10},
        fill:{fgColor:{rgb:'F3F0EB'}},
        alignment:{horizontal:'left', vertical:'center'},
        border: EX.border() }
  }),

  cell: (v, alt, bold) => ({
    v: v||'', t:'s',
    s:{ font:{name:'Calibri', sz:10, bold:!!bold, color:{rgb:'1C1814'}},
        fill:{fgColor:{rgb: alt ? 'FAF8F5' : 'FFFFFF'}},
        alignment:{horizontal:'left', vertical:'center', wrapText:true},
        border: EX.border() }
  }),

  timeCell: (v) => ({
    v: v||'', t:'s',
    s:{ font:{name:'Courier New', sz:10, color:{rgb:'7A7268'}},
        fill:{fgColor:{rgb:'F3F0EB'}},
        alignment:{horizontal:'center', vertical:'center'},
        border: EX.border() }
  }),

  catCell: (v, color) => ({
    v: v||'', t:'s',
    s:{ font:{name:'Calibri', sz:9, bold:true, color:{rgb: color||'1C1814'}},
        fill:{fgColor:{rgb:'FFFFFF'}},
        alignment:{horizontal:'left', vertical:'center'},
        border: EX.border() }
  }),

  accent: (v) => ({
    v, t:'s',
    s:{ font:{bold:true, color:{rgb:'FFFFFF'}, name:'Calibri', sz:10},
        fill:{fgColor:{rgb:'C8431A'}},
        alignment:{horizontal:'left', vertical:'center'},
        border: EX.border() }
  }),

  border: () => ({
    top:   {style:'thin', color:{rgb:'D4CDC3'}},
    bottom:{style:'thin', color:{rgb:'D4CDC3'}},
    left:  {style:'thin', color:{rgb:'D4CDC3'}},
    right: {style:'thin', color:{rgb:'D4CDC3'}},
  }),

  setCell: (ws, r, c, cellObj) => {
    const addr = XLSX.utils.encode_cell({r,c});
    ws[addr] = cellObj;
  },

  updateRange: (ws, maxR, maxC) => {
    ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:maxR,c:maxC}});
  }
};

// translate day type
function dtEn(dt) { return L().dt_label[dt] || dt; }

function doExport() {
  const t = getActive(); if(!t) return;
  const wb = XLSX.utils.book_new();
  const cats = getCats(t);

  // ── SHEET 1: TRIP OVERVIEW ───────────────────────────────────
  const wsOv = {};
  const ovRows = [
    ['TRIP OVERVIEW'],
    [],
    ['Trip Name',   t.name||''],
    ['Destination', t.dest||''],
    ['Site / Vendor', (t.site||'').toUpperCase()],
    ['Departure',   t.start||''],
    ['Return',      t.end||''],
    ['Total Days',  t.days.length],
    ['Work Days',   t.days.filter(d=>d.entries.some(e=>e.cat==='work'||e.cat==='qa')).length],
    ['Flights',     (t.flights||[]).length],
    ['Transfers',   (t.transfers||[]).length],
    [],
    ['Notes', t.notes||''],
  ];
  ovRows.forEach((row, ri) => {
    row.forEach((val, ci) => {
      const addr = XLSX.utils.encode_cell({r:ri, c:ci});
      if (ri===0 && ci===0) { wsOv[addr] = EX.accent(String(val)); return; }
      const isLabel = ci===0 && ri>1;
      wsOv[addr] = {
        v: val, t: typeof val==='number'?'n':'s',
        s:{ font:{name:'Calibri', sz:10, bold:isLabel, color:{rgb:'1C1814'}},
            fill:{fgColor:{rgb: ri%2===0?'FAF8F5':'FFFFFF'}},
            alignment:{horizontal:'left', vertical:'center'},
            border: EX.border() }
      };
    });
  });
  wsOv['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0},e:{r:ovRows.length,c:1}});
  wsOv['!cols'] = [{wch:18},{wch:40}];
  wsOv['!rows'] = [{hpt:20}];
  XLSX.utils.book_append_sheet(wb, wsOv, 'Trip Overview');

  // ── SHEET 2: DAILY SCHEDULE ──────────────────────────────────
  const wsSched = {};
  const SCHED_COLS = ['Day','Date','Day of Week','Day Type','Daily Goal','Time','Category','Activity'];
  SCHED_COLS.forEach((h,ci) => EX.setCell(wsSched, 0, ci, EX.hdr(h)));

  let row = 1;
  t.days.forEach((d, di) => {
    const alt = di%2===0;
    const isNewDay = true;
    const dayEntries = d.entries && d.entries.length ? d.entries : [null];

    dayEntries.forEach((e, ei) => {
      const isFirst = ei===0;
      const cat = e ? catById(t, e.cat) : null;
      const catColor = cat ? cat.color.replace('#','') : '7A7268';

      EX.setCell(wsSched, row, 0, isFirst ? EX.dayHdr(`Day ${d.dayNum}`)            : EX.cell('', alt));
      EX.setCell(wsSched, row, 1, isFirst ? EX.dayHdr(d.date)                        : EX.cell('', alt));
      EX.setCell(wsSched, row, 2, isFirst ? EX.dayHdr(d.dayLabel)                    : EX.cell('', alt));
      EX.setCell(wsSched, row, 3, isFirst ? EX.dayHdr(dtEn(d.dayType||'work'))       : EX.cell('', alt));
      EX.setCell(wsSched, row, 4, isFirst ? EX.cell(d.goal||'', alt, false)          : EX.cell('', alt));
      EX.setCell(wsSched, row, 5, e ? EX.timeCell(e.time||'')                        : EX.cell('', alt));
      EX.setCell(wsSched, row, 6, cat ? EX.catCell(`${cat.emoji} ${cat.name}`, catColor) : EX.cell('', alt));
      EX.setCell(wsSched, row, 7, e ? EX.cell(e.text||'', alt)                       : EX.cell('', alt));
      row++;
    });
  });

  EX.updateRange(wsSched, row, 7);
  wsSched['!cols'] = [{wch:8},{wch:13},{wch:12},{wch:13},{wch:32},{wch:7},{wch:18},{wch:55}];
  wsSched['!rows'] = [{ hpt:22 }];
  XLSX.utils.book_append_sheet(wb, wsSched, 'Daily Schedule');

  // ── SHEET 3: FLIGHTS ─────────────────────────────────────────
  const wsF = {};
  const FCOLS = ['Date','From','To','Carrier','Departure','Arrival','Flight #','Notes'];
  FCOLS.forEach((h,ci) => EX.setCell(wsF, 0, ci, EX.hdr(h)));
  (t.flights||[]).forEach((f, fi) => {
    const alt = fi%2===0;
    [f.date,f.from,f.to,f.carrier,f.dep,f.arr,f.flightNum,f.notes].forEach((v,ci)=>{
      EX.setCell(wsF, fi+1, ci, EX.cell(v||'', alt));
    });
  });
  EX.updateRange(wsF, (t.flights||[]).length, 7);
  wsF['!cols'] = [{wch:13},{wch:8},{wch:8},{wch:14},{wch:10},{wch:10},{wch:12},{wch:28}];
  XLSX.utils.book_append_sheet(wb, wsF, 'Flights');

  // ── SHEET 4: TRANSFERS ───────────────────────────────────────
  const wsTr = {};
  const TCOLS = ['Date','Time','From','To','Type','Vendor','Cost','Notes'];
  TCOLS.forEach((h,ci) => EX.setCell(wsTr, 0, ci, EX.hdr(h)));
  (t.transfers||[]).forEach((r, ri) => {
    const alt = ri%2===0;
    [r.date,r.time,r.from,r.to,r.type,r.vendor,r.cost,r.notes].forEach((v,ci)=>{
      EX.setCell(wsTr, ri+1, ci, EX.cell(v||'', alt));
    });
  });
  EX.updateRange(wsTr, (t.transfers||[]).length, 7);
  wsTr['!cols'] = [{wch:13},{wch:8},{wch:20},{wch:20},{wch:12},{wch:16},{wch:10},{wch:28}];
  XLSX.utils.book_append_sheet(wb, wsTr, 'Transfers');

  // ── SHEET 5: GANTT (logistics) ───────────────────────────────
  const wsG = {};
  const dayHeaders = t.days.map(d=>`Day ${d.dayNum}\n${d.date}`);
  EX.setCell(wsG, 0, 0, EX.hdr('Activity'));
  dayHeaders.forEach((h,ci) => EX.setCell(wsG, 0, ci+1, EX.hdr(h)));

  const ganttCats = cats.filter(c=>c.id==='flight'||c.id==='transfer');
  ganttCats.forEach((cat, ri) => {
    EX.setCell(wsG, ri+1, 0, EX.cell(`${cat.emoji} ${cat.name}`, ri%2===0));
    t.days.forEach((d,ci) => {
      const has = d.entries.some(e=>e.cat===cat.id);
      const addr = XLSX.utils.encode_cell({r:ri+1, c:ci+1});
      wsG[addr] = {
        v: has ? '✓' : '',
        t: 's',
        s:{ font:{name:'Calibri', sz:10, bold:has, color:{rgb: has ? 'FFFFFF' : '1C1814'}},
            fill:{fgColor:{rgb: has ? cat.color.replace('#','') : (ri%2===0?'FAF8F5':'FFFFFF')}},
            alignment:{horizontal:'center', vertical:'center'},
            border: EX.border() }
      };
    });
  });

  EX.updateRange(wsG, ganttCats.length, t.days.length);
  wsG['!cols'] = [{wch:20}, ...t.days.map(()=>({wch:9}))];
  XLSX.utils.book_append_sheet(wb, wsG, 'Gantt');

  const fname = `${(t.name||'trip').replace(/[^a-zA-Z0-9\s-]/g,'').trim().replace(/\s+/g,'-')}_schedule.xlsx`;
  XLSX.writeFile(wb, fname);
}

  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}

  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
